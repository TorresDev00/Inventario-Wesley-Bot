version: "3.1"

intents:
  - saludo
  - despedida
  - afirmar
  - negar
  - feliz
  - triste
  - desafiar_bot
  - chat_bot
  - services
  - lenguaje
  - name
  - agradecimiento
  - consultar_inventario
  - solicitar_donacion
  - preguntar_requisitos_donacion
  - preguntar_horarios
  - consultar_fecha_vencimiento
  - consular_entrada_mayor_medicamento

  - maxima_donacion
  - minima_donacion
  - proximo_vencimiento
  - medicamento_perdida
  - maxima_venta
  - minima_venta
  - total_donaciones_enviadas_mes
  - total_donaciones_recibidas_mes

responses:
  utter_saludo:
    - text: "¡Hola! ¿En qué puedo ayudarte?"
  utter_despedida:
    - text: "Adiós, ¡que tengas un buen día!"
  utter_feliz:
    - text: "¡Me alegra saberlo!"
  utter_triste:
    - text: "Lamento que te sientas así. Si puedo ayudarte en algo, dime."
  utter_soy_un_bot:
    - text: "Soy un bot, aquí para ayudarte con cualquier consulta del inventario de medicamentos."
  utter_como_donar:
    - text: "Puedes donar medicamentos directamente en nuestro centro durante los horarios de atención. ¡Gracias por tu apoyo!"
  utter_requisitos_donacion:
    - text: "Actualmente necesitamos medicamentos básicos como analgésicos, antibióticos y vitaminas. Para más detalles, por favor consulta con nosotros."
  utter_horarios:
    - text: "Estamos abiertos de lunes a viernes, de 8:00 a.m. a 5:00 p.m."
  utter_que_es_un_bot: 
    - text: "Un chatbot es un programa informático que simula la conversación humana con un usuario."
  utter_services:
    - text: "Puedo consultar el inventario de medicamentos, consultar la fecha de vencimiento de los medicamentos, solicitar donaciones, consultar los horarios de atención, consultar las donaciones recibidas y las donaciones enviadas, y más."
  utter_lenguaje:
    - text:  "Fui entrenado para solo hablar en español"
  utter_bot_name:
    - text: "Puedes llamarme Wesley Bot ."
  utter_gracias:
    - text: "Un placer en ayudarte, si necesitas algo más, no dudes en preguntar."

actions:
  - action_check_inventory
  - action_check_date_expiry
  - action_most_entered_medication

  - action_maxima_donacion
  - action_minima_donacion
  - action_proximo_vencimiento
  - action_medicamentos_perdidos
  - action_maxima_venta
  - action_minima_venta
  - action_total_donaciones_enviadas_mes
  - action_total_donaciones_recibidas_mes

entities:
  - medicamento

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true
