version: "3.1"

rules:


- rule: Decir adiós cada vez que el usuario se despide
  steps:
  - intent: despedida
  - action: utter_despedida

- rule: Decir "Soy un bot" cuando el usuario pregunte
  steps:
  - intent: desafiar_bot
  - action: utter_soy_un_bot

- rule: Responder afirmativamente cuando el usuario afirma
  steps:
  - intent: afirmar
  - action: utter_feliz  

- rule: Responder negativamente cuando el usuario niega
  steps:
  - intent: negar
  - action: utter_despedida

- rule: Responder con información sobre el bot
  steps:
  - intent: chat_bot
  - action: utter_que_es_un_bot

- rule: Responder con información sobre los servicios
  steps:
  - intent: services
  - action: utter_services

- rule: Responder con información sobre el lenguaje
  steps:
  - intent: lenguaje
  - action: utter_lenguaje

- rule: Responder con información sobre el nombre del bot
  steps:
  - intent: name
  - action: utter_bot_name

- rule: Responder con agradecimiento
  steps:
  - intent: agradecimiento  
  - action: utter_gracias

- rule: Consultar inventario de medicamentos
  steps:
  - intent: consultar_inventario
  - action: action_check_inventory

- rule: responder consulta sobre fecha de vencimiento
  steps:
  - intent: consultar_fecha_vencimiento
  - action: action_check_date_expiry

- rule: Responder consulta mayor entrada del mes
  steps:
  - intent: consular_entrada_mayor_medicamento
  - action: action_most_entered_medication

- rule: Explicar cómo hacer una donación cuando el usuario lo solicite
  steps:
  - intent: solicitar_donacion
  - action: utter_como_donar

- rule: Explicar los requisitos para donar medicamentos
  steps:
  - intent: preguntar_requisitos_donacion
  - action: utter_requisitos_donacion

- rule: Responder con los horarios del centro médico
  steps:
  - intent: preguntar_horarios
  - action: utter_horarios
  
- rule: Responder con el nombre del bot
  steps:
  - intent: name
  - action: utter_bot_name

- rule: Responder con agradecimiento
  steps:
  - intent: agradecimiento  
  - action: utter_gracias

- rule: Responder con el medicamento mas donado
  steps:
  - intent: maxima_donacion
  - action: action_maxima_donacion

- rule: Responder con el medicamento menos donado
  steps:
  - intent: minima_donacion
  - action: action_minima_donacion

- rule: Responder con el medicamento proximo a vencer
  steps:
  - intent: proximo_vencimiento
  - action: action_proximo_vencimiento

- rule: Responder con los medicamnetos mas perdidos
  steps:
  - intent: medicamento_perdida 
  - action: action_medicamentos_perdidos

- rule: Responder con el medicamento mas vendido
  steps:
  - intent: maxima_venta
  - action: action_maxima_venta

- rule: Responder con el medicamento menos vendido
  steps:
  - intent: minima_venta
  - action: action_minima_venta

- rule: Responder con el total de donaciones realizadas el mes
  steps:
  - intent: total_donaciones_enviadas_mes
  - action: action_total_donaciones_enviadas_mes

- rule: Responder con el total de donaciones recibidas el mes
  steps:
  - intent: total_donaciones_recibidas_mes
  - action: action_total_donaciones_recibidas_mes
