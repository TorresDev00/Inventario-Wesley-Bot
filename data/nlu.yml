    - tienes [Acetaminofén](medicamento)?

- intent: consultar_fecha_vencimiento
  examples: |
    - Cuál es la fecha de vencimiento de [Paracetamol](medicamento)?
    - Dame la fecha de vencimiento de [Ibuprofeno](medicamento).
